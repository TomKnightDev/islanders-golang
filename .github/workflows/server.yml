name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  IMAGE: ghcr.io/tomknightdev/islanders-server

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Tidy modules
      run: go mod tidy

    - name: Build Server
      run: go build -v -o bin/server ./server/

    - name: Test Server
      run: go test ./server/ ./resources/

  windows-client:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Install the Windows cross-compiler
      run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

    - name: Build the Windows client
      run: make package-windows

    - name: Upload Islanders-windows.zip
      uses: actions/upload-artifact@v7
      with:
        name: Islanders-windows
        path: bin/Islanders-windows.zip

  mac-client:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Build the macOS client (Apple Silicon and Intel)
      run: make package-mac

    - name: Upload Islanders-mac.zip
      uses: actions/upload-artifact@v7
      with:
        name: Islanders-mac
        path: bin/Islanders-mac.zip

  # Every push to master publishes both clients as a GitHub release, so the
  # latest build is always at Releases -> Latest.
  release:
    runs-on: ubuntu-latest
    needs: [windows-client, mac-client, deploy]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
    - name: Download the clients
      uses: actions/download-artifact@v7
      with:
        path: clients
        merge-multiple: true

    - name: Publish the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        MESSAGE: ${{ github.event.head_commit.message }}
      run: |
        tag="build-${{ github.run_number }}"
        summary="$(printf '%s\n' "$MESSAGE" | head -n 1)"
        cat > notes.md <<NOTES
        Clients for build ${{ github.run_number }} (${GITHUB_SHA::7}): ${summary}

        This build matches the live server.

        - **macOS:** download \`Islanders-mac.zip\`, unzip it and move Islanders.app to Applications. It isn't notarised, so the first time, either right-click it and choose Open, or run \`xattr -cr /Applications/Islanders.app\` in Terminal.
        - **Windows:** download \`Islanders-windows.zip\`, unzip it and run Islanders.exe. If SmartScreen warns about it, choose More info, then Run anyway.
        NOTES
        gh release create "$tag" clients/Islanders-mac.zip clients/Islanders-windows.zip \
          --target "$GITHUB_SHA" --title "Islanders build ${{ github.run_number }}" --notes-file notes.md --latest

  docker:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.IMAGE }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/master'

    steps:
    - name: Deploy to DigitalOcean Droplet
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.DO_HOST }}
        username: root
        key: ${{ secrets.DO_SSH_KEY }}
        script: |
          docker pull ${{ env.IMAGE }}:master
          docker stop islanders-server || true
          docker rm islanders-server || true
          docker run -d \
            --name islanders-server \
            -p 8285:8285 \
            --restart unless-stopped \
            ${{ env.IMAGE }}:master
